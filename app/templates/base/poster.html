<button type="button" class="poster" popovertarget="poster-{{ title.id }}"><img src="{{ title.poster_url }}"></button>
<div popover id="poster-{{ title.id }}" class="fullscreen-poster">

    <img loading="lazy" src="{{ title.fullscreen_poster_url }}">
</div>
