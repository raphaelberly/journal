[project]
name = "journal"
version = "0.1.0"
description = "Personal movie journal: a Flask web-app on Postgres, fed by TMDb and the open IMDb datasets"
requires-python = ">=3.14"
# The web-app, lib/ and the cron scripts share a single environment, both locally and on the Pi.
# Exact versions live in uv.lock, so that the Pi gets exactly what was tested here.
dependencies = [
    # Web app
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "wtforms>=3.2.2",
    "werkzeug>=3.1.9",

    # Database
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.4",

    # External services
    "requests>=2.34.2",
    # pushover is the Wyattjoh fork (see [tool.uv.sources]), NOT the unrelated PyPI package of the same name:
    # lib/push.py needs its Pushover class
    "pushover",

    # ETL and backup
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "toolz>=1.2.0",
    "tqdm>=4.70.1",

    # Not imported directly, but required at runtime
    "email-validator>=2.3.0",  # wtforms Email() validator
    "gunicorn>=26.2.0",  # production server, run under supervisor
]

[tool.uv]
# Scripts run from the checkout, there is nothing to build or install
package = false
# Only lock for the two machines running this: an Apple Silicon Mac and the Pi (64-bit ARM Linux)
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
pushover = { git = "https://github.com/Wyattjoh/pushover" }
